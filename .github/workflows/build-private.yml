name: Private-input iOS build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-input-build
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Check containment and transfer
        run: python -m unittest discover -s tests -v
      - name: Compile and return private results
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
          PRIVATE_TRANSFER_TOKEN: ${{ secrets.PRIVATE_TRANSFER_TOKEN }}
          PRIVATE_BUILD_SPEC: ${{ secrets.PRIVATE_BUILD_SPEC }}
          PYTHONUNBUFFERED: '1'
          PRIVATE_WORK_DIR: ${{ runner.temp }}/private-build
        run: python build_private.py
      - name: Return available private diagnostics
        if: always()
        timeout-minutes: 3
        env:
          PRIVATE_TRANSFER_TOKEN: ${{ secrets.PRIVATE_TRANSFER_TOKEN }}
          PRIVATE_BUILD_SPEC: ${{ secrets.PRIVATE_BUILD_SPEC }}
          PRIVATE_WORK_DIR: ${{ runner.temp }}/private-build
        run: python build_private.py --recover
